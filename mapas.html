<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Albion Hub - Mercado</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans p-4 md:p-8">
  <div class="max-w-7xl mx-auto space-y-6">
    <header class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 text-xl font-bold"><i class="fa-solid fa-crown"></i></div>
        <div>
          <a href="index.html" class="text-xl font-black text-emerald-400">ALBION HUB</a>
          <p class="text-[11px] text-slate-400">Servidor Exclusivo: <span class="text-emerald-300 font-semibold">América (West)</span></p>
        </div>
      </div>
      <nav class="flex flex-wrap gap-1 bg-slate-950 p-1.5 rounded-xl border border-slate-800 text-xs font-bold">
        <a href="index.html" class="px-3 py-2 text-slate-400 hover:text-slate-100">Refinación</a>
        <a href="islas.html" class="px-3 py-2 text-slate-400 hover:text-slate-100">Islas</a>
        <a href="crafteo.html" class="px-3 py-2 text-slate-400 hover:text-slate-100">Crafteo</a>
        <a href="mercado.html" class="px-3 py-2 bg-emerald-600 text-slate-950 rounded-lg">Mercado</a>
        <a href="jugadores.html" class="px-3 py-2 text-slate-400 hover:text-slate-100">Jugadores</a>
        <a href="mapas.html" class="px-3 py-2 text-slate-400 hover:text-slate-100">Mapas</a>
      </nav>
    </header>

    <section class="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-5">
      <h2 class="text-xl font-bold text-emerald-400 flex items-center gap-2"><i class="fa-solid fa-shop"></i> Mercado en Vivo (América)</h2>
      <div class="grid md:grid-cols-5 gap-3 bg-slate-950 p-4 rounded-xl border border-slate-800">
        <div class="md:col-span-2 relative">
          <label class="block text-[10px] uppercase font-bold text-slate-500 mb-1">Buscar Ítem</label>
          <input type="text" id="searchInput" placeholder="Ej: Hacha de batalla, Bolsa..." autocomplete="off" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-emerald-300 font-bold focus:border-emerald-500 focus:outline-none">
          <div id="autocompleteList" class="absolute z-50 w-full bg-slate-800 border border-slate-700 rounded-b-lg mt-1 max-h-48 overflow-y-auto hidden shadow-2xl"></div>
        </div>
        <div>
          <label class="block text-[10px] uppercase font-bold text-slate-500 mb-1">Tier</label>
          <select id="tierSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200"><option value="4">Tier 4</option><option value="5">Tier 5</option><option value="6" selected>Tier 6</option><option value="7">Tier 7</option><option value="8">Tier 8</option></select>
        </div>
        <div>
          <label class="block text-[10px] uppercase font-bold text-slate-500 mb-1">Encantamiento</label>
          <select id="enchantSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200"><option value="0" selected>.0 (Normal)</option><option value="1">.1</option><option value="2">.2</option><option value="3">.3</option><option value="4">.4</option></select>
        </div>
        <div>
          <label class="block text-[10px] uppercase font-bold text-slate-500 mb-1">Calidad</label>
          <select id="qualitySelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200"><option value="" selected>Todas</option><option value="1">Normal</option><option value="2">Bueno</option><option value="3">Notable</option><option value="4">Sobresaliente</option><option value="5">Excelente</option></select>
        </div>
      </div>
      <div class="flex justify-between">
        <button id="clearBtn" class="px-4 py-2 rounded-lg bg-slate-800 text-slate-300 text-xs font-bold">Borrar Filtros</button>
        <button id="searchBtn" class="px-6 py-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-slate-950 text-sm font-black flex items-center gap-2"><i id="searchSpinner" class="fa-solid fa-arrows-rotate"></i> Consultar Mercado</button>
      </div>
    </section>

    <main class="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden">
      <div class="p-4 border-b border-slate-800 flex items-center gap-3 bg-slate-950">
        <img id="searchPreviewImg" src="https://render.albiononline.com/v1/item/T4_BAG.png?size=64" onerror="this.src='https://render.albiononline.com/v1/item/TREASURE_KNOWLEDGE.png?size=64'" class="w-12 h-12 bg-slate-900 border border-slate-700 rounded-xl p-1">
        <div><h2 id="searchItemTitle" class="text-base font-black text-emerald-400">Selecciona un Ítem</h2><p id="searchItemIdStr" class="text-xs text-slate-500 font-mono">ID Técnico: ---</p></div>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-950 text-[11px] uppercase text-slate-400 border-b border-slate-800">
            <tr><th class="px-5 py-4 font-bold">Ciudad / Mercado</th><th class="px-5 py-4 font-bold text-blue-400">Venta Mín. (Comprar)</th><th class="px-5 py-4 font-bold text-emerald-400">Compra Máx. (Vender)</th></tr>
          </thead>
          <tbody id="pricesTableBody" class="divide-y divide-slate-800 font-medium">
            <tr><td colspan="3" class="px-6 py-8 text-center text-slate-500 text-xs">Usa el buscador para cargar datos en tiempo real.</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="items.js"></script>
  <script>
    let currentBaseId = null, currentNameEs = '';
    const CITIES = ['Bridgewatch', 'Fort Sterling', 'Lymhurst', 'Martlock', 'Thetford', 'Caerleon', 'Brecilien', 'Black Market'];
    const searchInput = document.getElementById('searchInput'), autocompleteList = document.getElementById('autocompleteList');

    searchInput.addEventListener('input', () => {
      const val = searchInput.value.toLowerCase().trim();
      autocompleteList.innerHTML = '';
      if(val.length < 2) { autocompleteList.classList.add('hidden'); return; }
      const matches = ITEMS_DB.filter(i => i.es.toLowerCase().includes(val)).slice(0, 10);
      if(matches.length) autocompleteList.classList.remove('hidden');
      matches.forEach(m => {
        const div = document.createElement('div');
        div.className = 'px-4 py-2 hover:bg-slate-700 cursor-pointer text-sm font-semibold text-emerald-300';
        div.textContent = m.es;
        div.onclick = () => {
          searchInput.value = m.es; currentBaseId = m.id; currentNameEs = m.es;
          autocompleteList.classList.add('hidden'); updatePreviewImg();
        };
        autocompleteList.appendChild(div);
      });
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      searchInput.value = ''; currentBaseId = null;
      document.getElementById('tierSelect').value = '6'; document.getElementById('enchantSelect').value = '0';
      updatePreviewImg();
    });

    function buildFinalId() {
      if(!currentBaseId) return null;
      const t = document.getElementById('tierSelect').value, enc = document.getElementById('enchantSelect').value;
      let id = `T${t}_${currentBaseId}`;
      if(enc !== '0' && !currentBaseId.includes('MOUNT') && !currentBaseId.includes('FARM')) id += `@${enc}`;
      return id;
    }

    function updatePreviewImg() {
      const finalId = buildFinalId();
      if(finalId) {
        document.getElementById('searchPreviewImg').src = `https://render.albiononline.com/v1/item/${finalId}.png?size=64`;
        document.getElementById('searchItemTitle').textContent = currentNameEs;
        document.getElementById('searchItemIdStr').textContent = `ID: ${finalId}`;
      } else {
        document.getElementById('searchPreviewImg').src = `https://render.albiononline.com/v1/item/T4_BAG.png?size=64`;
        document.getElementById('searchItemTitle').textContent = 'Selecciona un Ítem';
        document.getElementById('searchItemIdStr').textContent = 'ID Técnico: ---';
      }
    }

    ['tierSelect', 'enchantSelect'].forEach(id => document.getElementById(id).addEventListener('change', updatePreviewImg));

    async function doSearch() {
      const finalId = buildFinalId();
      if(!finalId) { alert('Por favor selecciona un ítem.'); return; }
      const q = document.getElementById('qualitySelect').value;
      document.getElementById('searchSpinner').classList.add('fa-spin');
      let url = `https://west.albion-online-data.com/api/v2/stats/prices/${finalId}.json?locations=${CITIES.join(',')}`;
      if(q) url += `&qualities=${q}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        const tbody = document.getElementById('pricesTableBody');
        tbody.innerHTML = '';
        CITIES.forEach(city => {
          const entries = data.filter(d => d.city === city);
          const sellMin = entries.length ? Math.min(...entries.map(e => e.sell_price_min).filter(p => p > 0)) : Infinity;
          const buyMax = entries.length ? Math.max(...entries.map(e => e.buy_price_max).filter(p => p > 0)) : 0;
          const validSell = sellMin !== Infinity ? sellMin : 0;

          const row = document.createElement('tr');
          row.className = 'hover:bg-slate-900/60';
          row.innerHTML = `
            <td class="px-5 py-4 font-bold text-slate-200">${city}</td>
            <td class="px-5 py-4 font-black ${validSell > 0 ? 'text-blue-400' : 'text-slate-600'}">${validSell > 0 ? validSell.toLocaleString() + ' 🥈' : 'Agotado'}</td>
            <td class="px-5 py-4 font-black ${buyMax > 0 ? 'text-emerald-400' : 'text-slate-600'}">${buyMax > 0 ? buyMax.toLocaleString() + ' 🥈' : 'Sin Órdenes'}</td>
          `;
          tbody.appendChild(row);
        });
      } catch (err) { console.error(err); } finally { document.getElementById('searchSpinner').classList.remove('fa-spin'); }
    }
    document.getElementById('searchBtn').addEventListener('click', doSearch);
  </script>
</body>
</html>
