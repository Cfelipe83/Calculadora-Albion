<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Albion Hub - Mapas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0b0f19; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #10b981; }
  </style>
</head>
<body class="bg-[#0b0f19] text-slate-200 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-slate-950 text-xs sm:text-sm">
  <div class="max-w-[1400px] mx-auto p-3 sm:p-6 space-y-5 w-full">
    
    <header class="bg-[#111827] border border-slate-800/80 rounded-2xl p-4 flex flex-col md:flex-row items-center justify-between gap-4 shadow-2xl">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 text-xl font-black"><i class="fa-solid fa-crown"></i></div>
        <div><a href="index.html" class="text-base sm:text-lg font-black text-emerald-400 tracking-wide flex items-center gap-2">ALBION HUB <span class="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded border border-emerald-500/40">WEST PRO</span></a><p class="text-[11px] text-slate-400">Servidor Exclusivo: América (West)</p></div>
      </div>
      <nav class="flex flex-wrap items-center justify-center gap-1.5 bg-[#0b0f19] p-1.5 rounded-xl border border-slate-800 text-xs font-bold">
        <a href="index.html" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-slate-200 hover:bg-slate-800 transition flex items-center gap-1.5"><i class="fa-solid fa-fire-burner"></i><span class="hidden md:inline">Refinación</span></a><a href="islas.html" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-slate-200 hover:bg-slate-800 transition flex items-center gap-1.5"><i class="fa-solid fa-wheat-awn"></i><span class="hidden md:inline">Islas</span></a><a href="crafteo.html" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-slate-200 hover:bg-slate-800 transition flex items-center gap-1.5"><i class="fa-solid fa-hammer"></i><span class="hidden md:inline">Crafteo</span></a><a href="mercado.html" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-slate-200 hover:bg-slate-800 transition flex items-center gap-1.5"><i class="fa-solid fa-scale-balanced"></i><span class="hidden md:inline">Mercado</span></a><a href="jugadores.html" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-slate-200 hover:bg-slate-800 transition flex items-center gap-1.5"><i class="fa-solid fa-users"></i><span class="hidden md:inline">Jugadores</span></a><a href="mapas.html" class="px-3 py-1.5 rounded-lg bg-emerald-600 text-slate-950 font-black shadow-md flex items-center gap-1.5"><i class="fa-solid fa-map"></i><span class="hidden md:inline">Mapas</span></a>
      </nav>
      <div class="flex items-center gap-2">
        <div class="flex items-center gap-1.5 bg-slate-950 border border-emerald-500/40 rounded-xl px-3 py-1.5 text-xs text-emerald-400 font-bold"><i class="fa-solid fa-server"></i><span class="hidden sm:inline">Servidor América</span></div>
      </div>
    </header>

    
    <section class="bg-[#111827] border border-slate-800 p-6 rounded-2xl shadow-xl space-y-6">
      <div><h2 class="text-xl font-bold text-emerald-400 flex items-center gap-2"><i class="fa-solid fa-map-location-dot"></i> Buscador de Mapas y Zonas</h2></div>
      <div class="relative"><i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-500"></i><input type="text" id="mapSearchInput" placeholder="Nombre del mapa..." class="w-full bg-[#0b0f19] border border-slate-800 rounded-xl pl-11 pr-4 py-3 text-sm text-slate-100 font-semibold focus:border-emerald-500 focus:outline-none"></div>
      <div id="mapResults" class="grid sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
    </section>
    <script>
      function renderMaps(maps) {
        const container = document.getElementById('mapResults');
        container.innerHTML = '';
        if(maps.length === 0) { container.innerHTML = '<p class="text-slate-500 text-sm">No se encontraron mapas.</p>'; return; }
        maps.forEach(m => {
          let pvpColor = 'text-blue-400';
          if(m.pvp.includes('Amarilla')) pvpColor = 'text-amber-400';
          if(m.pvp.includes('Roja')) pvpColor = 'text-rose-400';
          if(m.pvp.includes('Negra')) pvpColor = 'text-slate-950 bg-rose-500 px-1 rounded';
          const card = document.createElement('div');
          card.className = 'bg-[#0b0f19] border border-slate-800 p-5 rounded-2xl flex flex-col gap-3';
          card.innerHTML = `<div><h3 class="text-lg font-black text-slate-100"><i class="fa-solid fa-map text-emerald-500"></i> ${m.name}</h3><p class="text-xs text-slate-400 font-bold">${m.type} | Nivel: <span class="text-emerald-300">${m.tier}</span></p></div><div class="mt-2 text-sm space-y-1"><p><span class="text-slate-500 font-bold text-xs uppercase">Reglas PvP:</span> <span class="font-bold ${pvpColor}">${m.pvp}</span></p><p><span class="text-slate-500 font-bold text-xs uppercase">Recursos:</span> <span class="text-slate-300 font-semibold">${m.res}</span></p></div>`;
          container.appendChild(card);
        });
      }
      document.getElementById('mapSearchInput').addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase().trim();
        renderMaps(!q ? MAPS_DB : MAPS_DB.filter(m => m.name.toLowerCase().includes(q) || m.type.toLowerCase().includes(q)));
      });
      renderMaps(MAPS_DB);
    </script>


  </div>
  <footer class="mt-8 py-6 border-t border-slate-800 text-center text-xs text-slate-500 bg-[#111827]/50">
    <p>Albion Free Market Replica - Servidor América (West). Precios en tiempo real vía Albion Data Project.</p>
  </footer>
  <script src="items.js"></script>
</body>
</html>
