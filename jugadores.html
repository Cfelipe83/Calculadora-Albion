<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Albion Hub - Jugadores</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans p-4 md:p-8">
  <div class="max-w-7xl mx-auto space-y-6">
    <header class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 text-xl font-bold"><i class="fa-solid fa-crown"></i></div>
        <div>
          <a href="index.html" class="text-xl font-black text-emerald-400">ALBION HUB</a>
          <p class="text-[11px] text-slate-400">Servidor Exclusivo: <span class="text-emerald-300 font-semibold">América (West)</span></p>
        </div>
      </div>
      <nav class="flex flex-wrap gap-1 bg-slate-950 p-1.5 rounded-xl border border-slate-800 text-xs font-bold">
        <a href="index.html" class="px-3 py-2 text-slate-400 hover:text-slate-100">Refinación</a>
        <a href="islas.html" class="px-3 py-2 text-slate-400 hover:text-slate-100">Islas</a>
        <a href="crafteo.html" class="px-3 py-2 text-slate-400 hover:text-slate-100">Crafteo</a>
        <a href="mercado.html" class="px-3 py-2 text-slate-400 hover:text-slate-100">Mercado</a>
        <a href="jugadores.html" class="px-3 py-2 bg-emerald-600 text-slate-950 rounded-lg">Jugadores</a>
        <a href="mapas.html" class="px-3 py-2 text-slate-400 hover:text-slate-100">Mapas</a>
      </nav>
    </header>

    <section class="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-6">
      <h2 class="text-xl font-bold text-emerald-400 flex items-center gap-2"><i class="fa-solid fa-users"></i> Buscador de Jugadores (América)</h2>
      <div class="flex flex-col md:flex-row gap-3">
        <input type="text" id="playerName" placeholder="Nombre exacto del jugador (Ej: Shozen...)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-100 font-semibold focus:border-emerald-500 focus:outline-none">
        <button id="searchPlayerBtn" class="bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-black px-6 py-3 rounded-xl text-sm transition flex items-center justify-center gap-2">
          <i id="playerSpinner" class="fa-solid fa-search"></i> <span>Buscar Jugador</span>
        </button>
      </div>

      <div id="playerResults" class="grid sm:grid-cols-2 md:grid-cols-3 gap-4 hidden"></div>
      <div id="loadingMsg" class="hidden text-center text-slate-400 text-sm py-8"><i class="fa-solid fa-spinner fa-spin text-emerald-500 text-2xl mb-2"></i><br>Consultando servidores de Albion Online (América)...</div>
      <div id="errorMsg" class="hidden text-center text-rose-400 text-sm py-8 bg-rose-500/10 border border-rose-500/30 rounded-xl">Jugador no encontrado o sin datos recientes.</div>
    </section>
  </div>

  <script>
    async function searchPlayer() {
      const name = document.getElementById('playerName').value.trim();
      if(!name) return;
      
      const apiUrl = 'https://gameinfo.albiononline.com/api/gameinfo/search?q=' + encodeURIComponent(name);
      document.getElementById('playerResults').classList.add('hidden');
      document.getElementById('errorMsg').classList.add('hidden');
      document.getElementById('loadingMsg').classList.remove('hidden');
      document.getElementById('playerSpinner').className = 'fa-solid fa-spinner fa-spin';

      try {
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(apiUrl)}`;
        const res = await fetch(proxyUrl);
        const parsed = await res.json();
        document.getElementById('loadingMsg').classList.add('hidden');

        if(parsed.players && parsed.players.length > 0) {
          const container = document.getElementById('playerResults');
          container.innerHTML = '';
          parsed.players.forEach(p => {
            const kd = p.DeathFame > 0 ? (p.KillFame / p.DeathFame).toFixed(2) : p.KillFame;
            const card = document.createElement('div');
            card.className = 'bg-slate-950 border border-slate-800 p-5 rounded-2xl flex flex-col gap-3 relative overflow-hidden';
            card.innerHTML = `
              <div class="w-full h-1 bg-gradient-to-r from-emerald-500 to-blue-500 absolute top-0 left-0"></div>
              <h3 class="text-lg font-black text-slate-100 flex items-center gap-2"><i class="fa-solid fa-user text-emerald-500"></i> ${p.Name}</h3>
              <p class="text-xs text-slate-400 font-semibold">${p.GuildName ? `[${p.AllianceName || ''}] ${p.GuildName}` : 'Sin Gremio'}</p>
              <div class="grid grid-cols-2 gap-2 mt-2">
                <div class="bg-slate-900 p-2 rounded-lg"><span class="text-[10px] text-slate-500 uppercase font-bold">Fama PvP</span><span class="text-emerald-400 font-black text-sm block">${p.KillFame.toLocaleString()}</span></div>
                <div class="bg-slate-900 p-2 rounded-lg"><span class="text-[10px] text-slate-500 uppercase font-bold">Fama Muertes</span><span class="text-rose-400 font-black text-sm block">${p.DeathFame.toLocaleString()}</span></div>
                <div class="bg-slate-900 p-2 rounded-lg col-span-2 flex justify-between items-center"><span class="text-[10px] text-slate-500 uppercase font-bold">K/D Ratio</span><span class="text-blue-400 font-black text-sm">${kd}</span></div>
              </div>
            `;
            container.appendChild(card);
          });
          container.classList.remove('hidden');
        } else {
          document.getElementById('errorMsg').classList.remove('hidden');
        }
      } catch (e) {
        document.getElementById('loadingMsg').classList.add('hidden');
        document.getElementById('errorMsg').classList.remove('hidden');
      } finally {
        document.getElementById('playerSpinner').className = 'fa-solid fa-search';
      }
    }
    document.getElementById('searchPlayerBtn').addEventListener('click', searchPlayer);
    document.getElementById('playerName').addEventListener('keypress', (e) => { if(e.key === 'Enter') searchPlayer(); });
  </script>
</body>
</html>
